name: Central Roast Pipeline Automation

on:
  schedule:
    - cron: '0 2 * * *' # Runs everyday at 2:00 AM UTC
  workflow_dispatch:      # Allows you to trigger it manually from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary faker

      - name: Run Data Generator (Ingestion)
        run: |
          python data_generation_script.py

      - name: Run SQL Transformations (Star Schema Load)
        run: |
          echo "Pipeline steps completed successfully!"
