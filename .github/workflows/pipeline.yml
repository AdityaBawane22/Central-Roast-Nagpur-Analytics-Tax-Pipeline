name: Central Roast Data Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # This allows you to run the pipeline manually with one click from GitHub!

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas

      - name: Run Silver Layer Transformation
        run: python scripts/transform_silver_layer.py

      - name: Run Gold Layer Transformation
        run: python scripts/transform_gold_layer.py